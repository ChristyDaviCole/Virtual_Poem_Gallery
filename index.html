<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">
    
    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <h1>Virtual Poem Gallery</h1>

    <!-- HTML will go here -->

     <div id="wall-west">

        <div id="earth" class="poem-card">
            <h2>Earth</h2>
            <p>a b c d e f g</p>
        </div>

        <div id="fire" class="poem-card">
            <h2>Fire</h2>
            <p>h i j k l m n</p>
        </div>

     </div>

     <div id="wall-east">

        <div id="air" class="poem-card">
            <h2>Air</h2>
            <p>o p q r s t u</p>
        </div>

        <div id="water" class="poem-card">
            <h2>Water</h2>
            <p>v w x y z</p>
        </div>

     </div>

     <h2>Submission Station</h2>

     <input type="text" id="poem-title">
     <textarea id="poem-lines"></textarea>
     <input type="color" id="background-color">

     <select id="wall-select">
        <option value="wall-west">West Wall</option>
        <option value="wall-east">East Wall</option>
     </select>

     <button id="add-poem-btn">Add Poem</button>

    <script src="script.js"></script>
</body>

<!-- Journal Prompt 1 -->
